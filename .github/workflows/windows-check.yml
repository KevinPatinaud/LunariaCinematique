name: Windows validation
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install (commit the resulting package-lock.json for npm ci)
        run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Electron E2E (real application, isolated temporary profile)
        run: npm run test:e2e:built
      - name: Publish test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electron-test-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
